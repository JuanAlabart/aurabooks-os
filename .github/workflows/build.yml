name: Build AuraBooks Native ARM Binary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make wget file binutils

    - name: Download & Setup ARM Musl Toolchain
      run: |
        echo "Downloading musl ARM toolchain for Kindle..."
        wget --progress=dot:giga https://musl.cc/arm-linux-musleabi-cross.tgz
        tar -xzf arm-linux-musleabi-cross.tgz
        echo "$PWD/arm-linux-musleabi-cross/bin" >> $GITHUB_PATH

    - name: Compile AuraBooks Native Binary (Static Embedded)
      run: |
        make CC=arm-linux-musleabi-gcc CFLAGS="-O2 -march=armv7-a -mtune=cortex-a8 -mfloat-abi=softfp -mfpu=neon -std=gnu11 -Iinclude -D_GNU_SOURCE" LDFLAGS="-static -s -lm"

    - name: Verify Binary Architecture & Dependencies
      run: |
        file aurabooks_bin
        ls -la aurabooks_bin
        readelf -h aurabooks_bin

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aurabooks_bin_arm
        path: aurabooks_bin
