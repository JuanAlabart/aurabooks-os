name: Build AuraBooks Native ARM Binary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install ARM Cross-Compiler Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make

    - name: Compile AuraBooks Native Binary
      run: |
        make CC=arm-linux-gnueabi-gcc CFLAGS="-O2 -march=armv7-a -mtune=cortex-a8 -mfloat-abi=softfp -mfpu=neon -std=gnu11 -Iinclude -D_GNU_SOURCE"

    - name: Verify Binary Architecture
      run: |
        file aurabooks_bin
        ls -la aurabooks_bin

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aurabooks_bin_arm
        path: aurabooks_bin
